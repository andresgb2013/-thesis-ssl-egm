
data:
  source: ptbxl
  ptbxl_dir: data/raw/ptb-xl
  charite_dir: data/raw/charite
  max_records: null
  window_len: 200
  overlap: 0.5
  norm_mode: global

model:
  in_channels: 12
  hidden_dim: 128
  out_dim: 64
  n_augmentations: 6

training:
  epochs: 150
  batch_size: 512
  lr: 0.0003
  weight_decay: 0.0001
  temperature: 0.1
  reconstruction_weight: 0.0

evaluation:
  umap_neighbors: 15
  probe_max_iter: 1000

paths:
  results_dir: results
  checkpoint: results/encoder_v2.pt
  policy_checkpoint: results/policy_v2.pt
