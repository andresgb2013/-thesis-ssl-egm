data:
  source: ptbxl
  ptbxl_dir: data/raw/ptb-xl
  charite_dir: data/raw/charite
  max_records: 500
  window_len: 500
  overlap: 0.5

model:
  in_channels: 12
  hidden_dim: 128
  out_dim: 64
  n_augmentations: 6

training:
  epochs: 20
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  temperature: 0.07
  reconstruction_weight: 0.0

evaluation:
  umap_neighbors: 15
  probe_max_iter: 1000

paths:
  results_dir: results
  checkpoint: results/encoder.pt
  policy_checkpoint: results/policy.pt